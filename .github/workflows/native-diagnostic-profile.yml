name: Native diagnostic CPU profiles

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: native-diagnostic-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'native-profile')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare isolated diagnostic artifacts and fresh build directory
        run: |
          test "$(uname -m)" = x86_64
          echo "PROFILE_ROOT=$RUNNER_TEMP/native-diagnostic" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$(mktemp -d "$RUNNER_TEMP/native-profile-target.XXXXXX")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/native-diagnostic"
          git archive HEAD | gzip > "$RUNNER_TEMP/native-diagnostic/source.tar.gz"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: '1.96.0'
      - name: Dependencies and fixture checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$PROFILE_ROOT/dependencies.log"
          python3 -m unittest discover -s benchmarks/tests -v 2>&1 | tee "$PROFILE_ROOT/fixture-tests.log"
      - name: Build one candidate before profiling
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p oximut-cli 2>&1 | tee "$PROFILE_ROOT/build.log"
          cp "$CARGO_TARGET_DIR/release/oximut" "$PROFILE_ROOT/oximut"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['PROFILE_ROOT'])
          capture = lambda *cmd: subprocess.check_output(cmd, text=True).strip()
          files = capture('git', 'ls-files').splitlines()
          record = {
              'commit': capture('git', 'rev-parse', 'HEAD'),
              'build_flags': '--locked --release -p oximut-cli',
              'cargo_target_dir': os.environ['CARGO_TARGET_DIR'],
              'rustflags': os.environ.get('RUSTFLAGS'),
              'cargo_encoded_rustflags': os.environ.get('CARGO_ENCODED_RUSTFLAGS'),
              'host': capture('uname', '-a'),
              'tool_versions': {tool: capture(tool, '--version') for tool in ['rustc', 'cargo', 'node', 'npm', 'python3']},
              'binary_sha256': hashlib.sha256((root / 'oximut').read_bytes()).hexdigest(),
              'source_sha256': {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
                                for name in files if pathlib.Path(name).is_file()},
              'source_archive_sha256': hashlib.sha256((root / 'source.tar.gz').read_bytes()).hexdigest(),
          }
          (root / 'build-metadata.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Capture unchanged workload with profiler overhead, no ratios or targets
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
            --output "$PROFILE_ROOT/capture" 2>&1 | tee "$PROFILE_ROOT/diagnostic.log"
      - name: Publish diagnostic status and remove dependency symlinks
        if: always()
        shell: bash
        run: |
          {
            echo '### Diagnostic CPU capture (profiler overhead; no performance score)'
            echo 'Qualification failures and incomplete profiles are retained. No automatic retries.'
            echo 'Node sampling and Python self CPU do not partition whole product CPU; Rust resource sampler CPU remains unattributed.'
            if test -f "$RUNNER_TEMP/native-diagnostic/capture/diagnostic.json"; then
              echo '```json'
              cat "$RUNNER_TEMP/native-diagnostic/capture/diagnostic.json"
              echo '```'
            else
              echo 'FAILED/INCOMPLETE: capture summary absent; inspect setup/build/job logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if test -d "$RUNNER_TEMP/native-diagnostic"; then
            find "$RUNNER_TEMP/native-diagnostic" -type l -name node_modules -delete
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-diagnostic/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
