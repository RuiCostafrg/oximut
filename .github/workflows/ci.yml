name: Correctness and feasibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feasibility:
    runs-on: ubuntu-24.04
    # Native install/relocation smoke takes ~13 minutes before the full
    # acceptance suite; retain time for both, setup and benchmark smoke.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: '1.96.0'
          components: rustfmt, clippy
      - name: Require candidate isolation and hostile-candidate regressions
        run: |
          bash scripts/setup-candidate-sandbox.sh
          OXIMUT_REQUIRE_SANDBOX=1 python3 -m unittest discover -s tests -p test_candidate_sandbox.py -v
      - run: npm ci
      - name: Audit npm advisories (registry advisory data required)
        run: npm audit --audit-level=moderate
        timeout-minutes: 5
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Report and list schema validator contract
        run: node --test scripts/tests/validate-*.test.mjs
      - run: npm run experiment
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p oximut-cli --locked
      - name: Real installed and relocated smoke across the candidate boundary
        run: OXIMUT_REQUIRE_SANDBOX=1 OXIMUT_TEST_BINARY="$PWD/target/debug/oximut" python3 -m unittest discover -s tests -p test_candidate_sandbox.py -v
      - name: M1 correctness, M2 isolation, M3 selection, M4 cache, and M5 acceptance
        run: python3 -m unittest discover -s tests -v
      - name: Verify Oxc parses the fixture sources
        run: cargo run --locked -p oximut-oxc-smoke -- fixtures/pure/src/logic.ts fixtures/stateful/src/service.ts
      - name: Baseline smoke (not a performance comparison)
        run: python3 benchmarks/run.py --repetitions 1 --warmups 0 --timeout 180 --output .oximut/ci-baselines
      - name: M6 benchmark harness smoke (not a performance claim)
        run: python3 benchmarks/m6.py --fixtures m1 --tools oximut --scenarios clean --repetitions 1 --warmups 0 --output .oximut/ci-m6
      - name: Validate emitted CLI reports against the published schema
        run: >-
          node scripts/validate-reports.mjs
          .oximut/ci-m6/measured-01-m1-oximut-clean-fresh/run/report.json
          .oximut/ci-m6/measured-01-m1-oximut-clean-persistent/run/report.json
          .oximut/ci-m6/measured-01-m1-oximut-clean-selection/run/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: feasibility-results
          path: |
            .oximut/ci-baselines/**
            .oximut/ci-m6/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
