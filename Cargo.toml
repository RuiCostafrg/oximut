[workspace]
members = ["experiments/oxc-smoke", "crates/core", "crates/instrument", "crates/cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96.0"
version = "1.0.0-rc.1"
publish = false
license = "MIT"

[workspace.dependencies]
oxc_allocator = "=0.152.0"
oxc_parser = "=0.152.0"
oxc_span = "=0.152.0"
oxc_ast = "=0.152.0"
oxc_ast_visit = "=0.152.0"
oxc_syntax = "=0.152.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
libc = "=0.2.191"
