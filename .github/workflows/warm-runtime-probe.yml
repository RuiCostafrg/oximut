name: Experimental warm-runtime state oracle

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    # Always report the required check: decide here whether this PR touches
    # inputs the job below measures. If this detection fails, the job runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PATTERNS: |
            .github/workflows/warm-runtime-probe.yml
            benchmarks/experiments/warm-runtime-probe/**
            package-lock.json
            package.json
            .node-version
            benchmarks/results/2026-11-05-warm-runtime-probe/**
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo relevant=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          python3 - "$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT" <<'PY'
          import fnmatch, os, sys
          patterns = [p.strip() for p in os.environ["PATTERNS"].splitlines() if p.strip()]
          files = [f for f in open(sys.argv[1]).read().splitlines() if f]
          # The files API lists at most 3000 entries; treat a full page as relevant.
          relevant = len(files) >= 3000 or any(
              fnmatch.fnmatchcase(f, p) for f in files for p in patterns
          )
          print("relevant=" + str(relevant).lower())
          PY

  structural-oracle:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test benchmarks/experiments/warm-runtime-probe/test-validation.mjs
      - name: Preserve executed source and run state oracles (no timing claims)
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          mkdir "$RUNNER_TEMP/warm-runtime-probe"
          git archive HEAD | gzip > "$RUNNER_TEMP/warm-runtime-probe/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/warm-runtime-probe/commit.txt"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'warm-runtime-probe'
          script = 'benchmarks/experiments/warm-runtime-probe/probe.mjs'
          cases = [('stock', []), ('raw-warm', ['--case', 'warmVm-true-separate'])]
          for mode in ['module-only', 'env-only', 'fs-only', 'host-dirty']:
              for label, pool in [('guard', 'guardedVm'), ('fork', 'forks')]:
                  cases.append((f'{label}-{mode}', ['--case', f'{pool}-true-separate', '--mode', mode]))
          for name, args in cases:
              with (root / f'{name}.log').open('w') as log:
                  subprocess.run(['node', script, *args, '--output', str(root / name)],
                                 stdout=log, stderr=subprocess.STDOUT, check=True, timeout=180)
              rows = [json.loads(line) for line in (root / name / 'results.jsonl').read_text().splitlines()]
              subprocess.run(['node', 'benchmarks/experiments/warm-runtime-probe/validation.mjs',
                              name, str(root / name / 'results.jsonl')], check=True, timeout=30)
              print(name, [row['counts'] for row in rows], flush=True)
          PY
      - name: Declare diagnostic scope
        if: always()
        run: |
          echo 'Structural state oracles only; no product isolation mode enabled.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Wall, CPU user/sys, aggregate RSS/process-tree, phase timings, paired ratios and CIs: unmeasured/N/A.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Passing the shallow guard does not establish fresh-process equivalence or any performance target.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: warm-runtime-probe-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/warm-runtime-probe/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
