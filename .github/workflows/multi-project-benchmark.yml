name: Multi-project benchmark

# Oximut (default flags) against StrykerJS (@stryker-mutator/vitest-runner, coverageAnalysis
# perTest) on several pinned real Vitest projects and matched worker counts. One matrix cell is
# one project at one worker count; every cell uploads its raw rounds and `cell.json`, and the
# summary job turns all cells into one markdown table. Results are evidence for whether the
# colord numbers generalize, never a gate. See docs/multi-project-benchmark.md.
#
# Triggers: manual dispatch (the full matrix by default), and pull requests that touch the
# harness, which run a one-round smoke (ufo and es-toolkit at 2 workers). Adding the
# `multi-project-full` label to such a pull request runs the full matrix at 5 rounds instead.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/multi-project-benchmark.yml
      - benchmarks/multi_project.py
      - benchmarks/multi_project_report.py
      - benchmarks/multi-project/**
      - benchmarks/parity/corpus.json
      - benchmarks/parity/configs/**
      - benchmarks/tests/test_multi_project.py
  workflow_dispatch:
    inputs:
      projects:
        type: string
        default: ''
        description: 'Space-separated project names (ufo pathe hookable std-env tslog valibot es-toolkit); empty runs all'
      workers:
        type: string
        default: '2 4'
        description: 'Space-separated matched worker counts. GitHub standard runners have 4 vCPUs, so 8 is recorded as skipped (oversubscribed), not run'
      rounds:
        type: string
        default: '3'
        description: 'Measured rounds per tool (a warmup round runs first); 3 or more gives a ratio interval'
      warmups:
        type: string
        default: '1'
        description: 'Discarded warmup rounds'
      scope:
        type: choice
        default: matched
        options:
          - matched
          - full
        description: 'matched: Stryker limited to the operators matching Oximut families; full: each tool runs all its default operators'

permissions:
  contents: read

concurrency:
  group: multi-project-benchmark-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # Other labels on a pull request do not start a benchmark.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'multi-project-full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      rounds: ${{ steps.plan.outputs.rounds }}
      warmups: ${{ steps.plan.outputs.warmups }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Unit tests for the harness
        run: python3 -m unittest discover -s benchmarks/tests -p test_multi_project.py -v
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'multi-project-full') }}
          INPUT_PROJECTS: ${{ inputs.projects }}
          INPUT_WORKERS: ${{ inputs.workers }}
          INPUT_ROUNDS: ${{ inputs.rounds }}
          INPUT_WARMUPS: ${{ inputs.warmups }}
          INPUT_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          # Dispatch: the inputs' defaults. Pull request: a smoke, or the full matrix with the label.
          if [[ "$EVENT" == pull_request && "$FULL_LABEL" != true ]]; then
            PROJECTS='ufo es-toolkit'; WORKERS=2; ROUNDS=1; WARMUPS=0
          elif [[ "$EVENT" == pull_request ]]; then
            PROJECTS=''; WORKERS='2 4'; ROUNDS=5; WARMUPS=1
          else
            PROJECTS=$INPUT_PROJECTS; WORKERS=${INPUT_WORKERS:-2 4}; ROUNDS=${INPUT_ROUNDS:-3}; WARMUPS=${INPUT_WARMUPS:-1}
          fi
          SCOPE=${INPUT_SCOPE:-matched}
          [[ "$ROUNDS" =~ ^[0-9]{1,2}$ ]] && (( 10#$ROUNDS >= 1 )) || { echo "::error::rounds '$ROUNDS' must be 1-99"; exit 1; }
          [[ "$WARMUPS" =~ ^[0-9]$ ]] || { echo "::error::warmups '$WARMUPS' must be 0-9"; exit 1; }
          read -r -a names <<< "$PROJECTS"
          matrix=$(python3 benchmarks/multi_project.py --plan "$WORKERS" --projects "${names[@]}")
          {
            echo "matrix=$matrix"; echo "rounds=$ROUNDS"; echo "warmups=$WARMUPS"; echo "scope=$SCOPE"
          } >> "$GITHUB_OUTPUT"
          echo "$matrix rounds=$ROUNDS warmups=$WARMUPS scope=$SCOPE"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: '1.96.0'
      - run: cargo build --locked --release -p oximut-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-project-oximut-binary
          path: target/release/oximut
          if-no-files-found: error
          retention-days: 7

  cell:
    name: ${{ matrix.project }} x${{ matrix.workers }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - name: Build the zygote addon (a skip is a failure here)
        run: |
          python3 scripts/build-zygote-addon.py | tee addon-build.log
          if grep -q '^skipped' addon-build.log; then
            echo "::error::the zygote addon build was skipped on glibc"
            exit 1
          fi
          test -f packages/vitest-adapter/native/build/zygote-fork.node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: multi-project-oximut-binary
          path: ${{ runner.temp }}/oximut-binary
      - name: Measure the cell
        env:
          PROJECT: ${{ matrix.project }}
          WORKERS: ${{ matrix.workers }}
          ROUNDS: ${{ needs.plan.outputs.rounds }}
          WARMUPS: ${{ needs.plan.outputs.warmups }}
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          chmod +x "$RUNNER_TEMP/oximut-binary/oximut"
          echo "cpus: $(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
          python3 benchmarks/multi_project.py --projects "$PROJECT" --workers "$WORKERS" \
            --scope "$SCOPE" --warmups "$WARMUPS" --rounds "$ROUNDS" \
            --binary "$RUNNER_TEMP/oximut-binary/oximut" --skip-oversubscribed \
            --output "$RUNNER_TEMP/cell"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: multi-project-cell-${{ matrix.project }}-w${{ matrix.workers }}
          path: ${{ runner.temp }}/cell/**
          if-no-files-found: warn
          retention-days: 14

  summary:
    needs: [plan, cell]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: multi-project-cell-*
          path: ${{ runner.temp }}/cells
      - name: Combined table
        run: python3 benchmarks/multi_project_report.py "$RUNNER_TEMP/cells" --output "$RUNNER_TEMP/summary"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-project-summary
          path: ${{ runner.temp }}/summary/**
          if-no-files-found: error
          retention-days: 30
