name: W13 bounded paired native scoring
on:
  workflow_dispatch:
  push:
    branches: [perf/w13-score-native-2]
permissions:
  contents: read
  actions: read
concurrency:
  group: w13-score-native
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
      - name: Preserve source before prerequisites
        run: |
          mkdir "$RUNNER_TEMP/w13-score"
          git rev-parse HEAD > "$RUNNER_TEMP/w13-score/commit.txt"
          git archive HEAD Cargo.toml Cargo.lock rust-toolchain.toml crates experiments/oxc-smoke packages/vitest-adapter benchmarks/experiments/vitest5-private-bootstrap benchmarks/real-project/colord benchmarks/real_project.py benchmarks/run.py benchmarks/m6.py benchmarks/compare_candidates.py benchmarks/targets.py benchmarks/w13_score.py benchmarks/w13_score_summary.py benchmarks/tests benchmarks/config fixtures benchmarks/w13-score-qualification.json benchmarks/results/2026-11-14-w13-map-base/native/runtime-provenance.json package.json package-lock.json .node-version .github/workflows/w13-scored.yml | gzip > "$RUNNER_TEMP/w13-score/source.tar.gz"
      - name: Require exact successful native lifecycle and structural requalification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,os
          receipt=json.loads(pathlib.Path('benchmarks/w13-score-qualification.json').read_text())
          assert receipt['qualified_source']=='e9a368face7d8e3fd657383c2c979e2866370a38'
          for run in receipt['native_runs']:
              info=json.loads(subprocess.check_output(['gh','api',f'repos/RuiCostafrg/oximut/actions/runs/{run}'],text=True))
              assert info['head_sha']==receipt['qualified_source'] and info['status']=='completed' and info['conclusion']=='success'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'w13-score'
          (root/'qualification-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Install and focused harness/type checks before timing
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s benchmarks/tests -p test_w13_score.py -v > "$RUNNER_TEMP/w13-score/harness.stdout.log" 2> "$RUNNER_TEMP/w13-score/harness.stderr.log"
          npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/w13-score/install.stdout.log" 2> "$RUNNER_TEMP/w13-score/install.stderr.log"
          npm run typecheck > "$RUNNER_TEMP/w13-score/typecheck.stdout.log" 2> "$RUNNER_TEMP/w13-score/typecheck.stderr.log"
      - name: Build exact stock and experiment into isolated targets
        run: |
          set -euo pipefail
          stock="$RUNNER_TEMP/w13-stock"
          mkdir "$stock"
          git archive 5dfd17e53cd7b067586b3ad47363cb3ecee5873e Cargo.toml Cargo.lock rust-toolchain.toml crates experiments/oxc-smoke packages/vitest-adapter package.json package-lock.json | gzip > "$RUNNER_TEMP/w13-score/stock-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/w13-score/stock-source.tar.gz" -C "$stock"
          python3 - <<'PY'
          import os,pathlib,tomllib
          stock=pathlib.Path(os.environ['RUNNER_TEMP'])/'w13-stock'
          workspace=tomllib.loads((stock/'Cargo.toml').read_text())['workspace']['members']
          assert all((stock/member/'Cargo.toml').is_file() for member in workspace),'Every pinned workspace member must be archived before building'
          PY
          ln -s "$GITHUB_WORKSPACE/node_modules" "$stock/node_modules"
          cargo build --manifest-path "$stock/Cargo.toml" --target-dir "$RUNNER_TEMP/w13-stock-target" --locked --release -p oximut-cli > "$RUNNER_TEMP/w13-score/build-stock.stdout.log" 2> "$RUNNER_TEMP/w13-score/build-stock.stderr.log"
          cargo build --target-dir "$RUNNER_TEMP/w13-candidate-target" --locked --release -p oximut-cli > "$RUNNER_TEMP/w13-score/build-candidate.stdout.log" 2> "$RUNNER_TEMP/w13-score/build-candidate.stderr.log"
          mkdir "$RUNNER_TEMP/w13-score/binaries"
          cp "$RUNNER_TEMP/w13-stock-target/release/oximut" "$RUNNER_TEMP/w13-score/binaries/stock"
          cp "$RUNNER_TEMP/w13-candidate-target/release/oximut" "$RUNNER_TEMP/w13-score/binaries/candidate"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);root=temp/'w13-score'
          capture=lambda *cmd:subprocess.check_output(cmd,text=True).strip()
          meta={'before_commit':capture('git','rev-parse','5dfd17e'),'after_commit':capture('git','rev-parse','HEAD'),'build_flags':'--locked --release -p oximut-cli','cargo_target_dirs':{'before':str(temp/'w13-stock-target'),'after':str(temp/'w13-candidate-target')},'before_source':str(temp/'w13-stock'),'after_source':os.environ['GITHUB_WORKSPACE'],'binary_sha256':{v:hashlib.sha256((root/'binaries'/n).read_bytes()).hexdigest() for v,n in [('before','stock'),('after','candidate')]},'tool_versions':{n:capture(n,'--version') for n in ['node','npm','cargo','rustc','python3']},'policy':'Both exact isolated builds complete before timing. No profiler or retries. Preparation is measured per candidate invocation; see score policy.'}
          (root/'build-metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
      - name: One warmup and five measured pairs per configuration, serial tools
        run: |
          set -euo pipefail
          qualified=$(python3 -c 'import json;print(json.load(open("benchmarks/w13-score-qualification.json"))["qualified_source"])')
          for scope in colord colord-scale; do
            for workers in 2 4; do
              python3 benchmarks/w13_score.py "$RUNNER_TEMP/w13-score/$scope-${workers}w" \
                --workload "$scope" --workers "$workers" --qualified-source "$qualified" \
                --before-binary "$RUNNER_TEMP/w13-score/binaries/stock" \
                --after-binary "$RUNNER_TEMP/w13-score/binaries/candidate" \
                --stock-source "$RUNNER_TEMP/w13-stock" \
                --build-metadata "$RUNNER_TEMP/w13-score/build-metadata.json" \
                > "$RUNNER_TEMP/w13-score/$scope-${workers}w.stdout.log" 2> "$RUNNER_TEMP/w13-score/$scope-${workers}w.stderr.log"
            done
          done
      - name: Preserve full raw evidence without dependency-directory symlinks
        if: always()
        run: |
          # Always produce a global result, including missing/failed prerequisites.
          python3 benchmarks/w13_score_summary.py "$RUNNER_TEMP/w13-score" || summary_failed=$?
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);root=temp/'w13-score'
          if root.exists():
              with tarfile.open(temp/'w13-score-raw.tar.gz','w:gz') as t:
                  t.add(root,arcname='raw',filter=lambda m:None if m.issym() or 'node_modules' in pathlib.Path(m.name).parts else m)
              inventory={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and not p.is_symlink() and 'node_modules' not in p.relative_to(root).parts}
              (temp/'w13-score-files.json').write_text(json.dumps(inventory,indent=2)+'\n')
          PY
          exit "${summary_failed:-0}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: w13-scored-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/w13-score-raw.tar.gz
            ${{ runner.temp }}/w13-score-files.json
          if-no-files-found: error
          retention-days: 14
