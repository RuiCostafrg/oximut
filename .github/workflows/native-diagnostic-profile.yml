name: Native diagnostic CPU profiles

on:
  workflow_dispatch:
    inputs:
      capture_mode:
        description: Diagnostic scope (profiler overhead; never scored ratios)
        type: choice
        default: accounting
        options:
          - accounting
          - controller-jobs
          - segments
          - cpu-prof-exec-argv
          - zygote-timeline
      workload:
        description: 'Mutation scope for zygote-timeline only (other modes keep their default workload)'
        type: choice
        default: colord-scale
        options:
          - colord
          - colord-scale
      concurrency:
        description: 'Matched parallelism: Oximut --workers and Stryker concurrency'
        type: string
        default: '1'
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: native-diagnostic-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'native-profile') && (github.event.action != 'labeled' || github.event.label.name == 'native-profile'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare isolated diagnostic artifacts and fresh build directory
        run: |
          test "$(uname -m)" = x86_64
          echo "PROFILE_ROOT=$RUNNER_TEMP/native-diagnostic" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$(mktemp -d "$RUNNER_TEMP/native-profile-target.XXXXXX")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/native-diagnostic"
          git archive HEAD | gzip > "$RUNNER_TEMP/native-diagnostic/source.tar.gz"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: '1.96.0'
      - name: Validate the matched concurrency before building
        env:
          MATCHED_CONCURRENCY: ${{ inputs.concurrency || '1' }}
        run: |
          cpus=$(nproc)
          if ! [[ "$MATCHED_CONCURRENCY" =~ ^[0-9]{1,4}$ ]] ||
            (( 10#$MATCHED_CONCURRENCY < 1 || 10#$MATCHED_CONCURRENCY > 1024 || 10#$MATCHED_CONCURRENCY > cpus )); then
            echo "::error::concurrency '$MATCHED_CONCURRENCY' must be an integer from 1 to 1024 and at most the $cpus usable CPUs"
            exit 1
          fi
      - name: Dependencies and fixture checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$PROFILE_ROOT/dependencies.log"
          python3 -m unittest discover -s benchmarks/tests -v 2>&1 | tee "$PROFILE_ROOT/fixture-tests.log"
          python3 -m unittest discover -s benchmarks/profiling -p 'test_*.py' -v 2>&1 | tee "$PROFILE_ROOT/controller-fixture-tests.log"
      - name: Build one candidate before profiling
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p oximut-cli 2>&1 | tee "$PROFILE_ROOT/build.log"
          cp "$CARGO_TARGET_DIR/release/oximut" "$PROFILE_ROOT/oximut"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['PROFILE_ROOT'])
          capture = lambda *cmd: subprocess.check_output(cmd, text=True).strip()
          files = capture('git', 'ls-files').splitlines()
          record = {
              'commit': capture('git', 'rev-parse', 'HEAD'),
              'build_flags': '--locked --release -p oximut-cli',
              'cargo_target_dir': os.environ['CARGO_TARGET_DIR'],
              'rustflags': os.environ.get('RUSTFLAGS'),
              'cargo_encoded_rustflags': os.environ.get('CARGO_ENCODED_RUSTFLAGS'),
              'host': capture('uname', '-a'),
              'tool_versions': {tool: capture(tool, '--version') for tool in ['rustc', 'cargo', 'node', 'npm', 'python3']},
              'binary_sha256': hashlib.sha256((root / 'oximut').read_bytes()).hexdigest(),
              'source_sha256': {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
                                for name in files if pathlib.Path(name).is_file()},
              'source_archive_sha256': hashlib.sha256((root / 'source.tar.gz').read_bytes()).hexdigest(),
          }
          (root / 'build-metadata.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Build the zygote addon (zygote-timeline only; skipped is a failure)
        if: inputs.capture_mode == 'zygote-timeline'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-zygote-addon.py | tee "$PROFILE_ROOT/zygote-addon-build.log"
          test -f packages/vitest-adapter/native/build/zygote-fork.node
      - name: Capture unchanged workload with profiler overhead, no ratios or targets
        if: inputs.capture_mode != 'zygote-timeline'
        shell: bash
        env:
          CAPTURE_MODE: ${{ inputs.capture_mode || 'accounting' }}
          MATCHED_CONCURRENCY: ${{ inputs.concurrency || '1' }}
        run: |
          set -euo pipefail
          case "$CAPTURE_MODE" in
            accounting) CAPTURE_ARGS=(--accounting) ;;
            controller-jobs) CAPTURE_ARGS=(--controller-jobs) ;;
            segments) CAPTURE_ARGS=(--segments) ;;
            cpu-prof-exec-argv) CAPTURE_ARGS=(--cpu-prof-exec-argv) ;;
            *) echo 'Unsupported capture mode' >&2; exit 1 ;;
          esac
          python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
            "${CAPTURE_ARGS[@]}" --concurrency "$MATCHED_CONCURRENCY" --output "$PROFILE_ROOT/capture" 2>&1 | tee "$PROFILE_ROOT/diagnostic.log"
      - name: Capture the zygote timeline trace, plus an untraced run for the overhead comparison
        if: inputs.capture_mode == 'zygote-timeline'
        shell: bash
        env:
          MATCHED_CONCURRENCY: ${{ inputs.concurrency || '1' }}
          WORKLOAD: ${{ inputs.workload || 'colord-scale' }}
        run: |
          set -euo pipefail
          out="$PROFILE_ROOT/zygote-timeline"
          mkdir -p "$out/trace"
          # Oximut alone: one run of `--execution persistent --zygote`, no profiler, no warmup.
          # The harness exits 1 without the other tools to compare, so check the row instead.
          run() {
            name="$1"; shift
            env "$@" python3 benchmarks/real_project.py --binary "$PROFILE_ROOT/oximut" \
              --adapter packages/vitest-adapter/m2-runner.mjs --adapter-source-dir packages/vitest-adapter \
              --defer-ratios --tools oximut --oximut-arg --zygote --warmups 0 --repetitions 1 \
              --concurrency "$MATCHED_CONCURRENCY" --workload "$WORKLOAD" --timeout 1200 \
              --output "$out/$name" 2>&1 | tee "$out/$name.log" || true
          }
          run untraced -u OXIMUT_TRACE_TIMELINE
          run traced "OXIMUT_TRACE_TIMELINE=$out/trace"
          python3 benchmarks/profiling/zygote_timeline.py "$out/trace" --json "$out/timeline-summary.json" | tee "$out/timeline-summary.txt"
          python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ['PROFILE_ROOT']) / 'zygote-timeline'
          rows = {name: json.loads((out / name / 'measurements.jsonl').read_text().splitlines()[0])
                  for name in ('untraced', 'traced')}
          failed = [name for name, row in rows.items() if not row.get('success')]
          keys = ('wall_seconds', 'cpu_seconds', 'peak_aggregate_rss_bytes')
          overhead = {'untraced': {k: rows['untraced'][k] for k in keys},
                      'traced': {k: rows['traced'][k] for k in keys},
                      'traced_over_untraced': {k: rows['traced'][k] / rows['untraced'][k] for k in keys},
                      'note': 'One run each, untraced first; indicative only. Trace overhead is a lower bound on the noise.'}
          (out / 'overhead.json').write_text(json.dumps(overhead, indent=2) + '\n')
          print(json.dumps(overhead, indent=2))
          if failed:
              raise SystemExit(f'runs failed validation: {failed}')
          PY
      - name: Publish diagnostic status and remove dependency symlinks
        if: always()
        shell: bash
        run: |
          {
            echo '### Diagnostic CPU capture (profiler overhead; no performance score)'
            echo 'Qualification failures and incomplete profiles are retained. No automatic retries.'
            echo 'Accounting mode measures CLI sampling-thread self CPU only; Node/Python modes remain separate. No mode partitions whole product CPU.'
            if test -f "$RUNNER_TEMP/native-diagnostic/zygote-timeline/timeline-summary.txt"; then
              echo 'zygote-timeline: opt-in trace, one traced and one untraced run; no performance score.'
              echo '```'
              cat "$RUNNER_TEMP/native-diagnostic/zygote-timeline/timeline-summary.txt"
              test -f "$RUNNER_TEMP/native-diagnostic/zygote-timeline/overhead.json" && cat "$RUNNER_TEMP/native-diagnostic/zygote-timeline/overhead.json"
              echo '```'
            elif test -f "$RUNNER_TEMP/native-diagnostic/capture/diagnostic.json"; then
              echo '```json'
              python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'benchmarks')
          from profile_native import compact_summary
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-diagnostic/capture/diagnostic.json'
          print(json.dumps(compact_summary(json.loads(source.read_text())), indent=2))
          PY
              echo '```'
            else
              echo 'FAILED/INCOMPLETE: capture summary absent; inspect setup/build/job logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if test -d "$RUNNER_TEMP/native-diagnostic"; then
            find "$RUNNER_TEMP/native-diagnostic" -type l -name node_modules -delete
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-diagnostic/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
