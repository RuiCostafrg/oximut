name: Native diagnostic CPU profiles

on:
  workflow_dispatch:
    inputs:
      capture_mode:
        description: Capture mode (score modes are unprofiled)
        type: choice
        default: accounting
        options:
          - accounting
          - worker-snapshot-accounting
          - controller-jobs
          - worker-phases
          - fresh-worker-startup
          - worker-bundle
          - worker-snapshot
          - worker-snapshot-source-io
          - worker-snapshot-stack
          - worker-snapshot-collection-cpu
          - worker-snapshot-execution-cpu
          - worker-snapshot-baseline-tier
          - worker-snapshot-compact-errors
          - worker-snapshot-specialize-selector
          - worker-snapshot-bundle-project
          - worker-snapshot-native-project
          - worker-snapshot-score
          - worker-snapshot-compact-score
          - worker-snapshot-composed-score
          - worker-snapshot-rolling-score
          - worker-snapshot-windowed-score
          - worker-snapshot-late-score
          - worker-snapshot-factory-score
          - worker-snapshot-shared-image-score
          - worker-snapshot-single-image-score
          - worker-snapshot-reuse-build-score
          - worker-snapshot-early-build-score
          - worker-snapshot-composed-profile
          - worker-snapshot-composed-startup
          - worker-snapshot-zygote-startup
          - worker-snapshot-late-runtime
          - segments
      workload:
        description: Mutation workload
        type: choice
        default: colord
        options:
          - colord
          - colord-scale
      concurrency:
        description: 'Matched parallelism: Oximut --workers and Stryker concurrency'
        type: string
        default: '1'
      late_runtime_sample:
        description: Optional worker CPU sample for the late-runtime diagnostic
        type: choice
        default: none
        options:
          - none
          - execution
      accounting_variant:
        description: Snapshot wrapper used by the accounting diagnostic
        type: choice
        default: shared-image
        options:
          - shared-image
          - single-image
          - reuse-build
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: native-diagnostic-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'native-profile') && (github.event.action != 'labeled' || github.event.label.name == 'native-profile'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare isolated diagnostic artifacts and fresh build directory
        run: |
          test "$(uname -m)" = x86_64
          echo "PROFILE_ROOT=$RUNNER_TEMP/native-diagnostic" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$(mktemp -d "$RUNNER_TEMP/native-profile-target.XXXXXX")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/native-diagnostic"
          git archive HEAD | gzip > "$RUNNER_TEMP/native-diagnostic/source.tar.gz"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: '1.96.0'
      - name: Validate the matched concurrency before building
        env:
          MATCHED_CONCURRENCY: ${{ inputs.concurrency || '1' }}
        run: |
          cpus=$(nproc)
          if ! [[ "$MATCHED_CONCURRENCY" =~ ^[0-9]{1,4}$ ]] ||
            (( 10#$MATCHED_CONCURRENCY < 1 || 10#$MATCHED_CONCURRENCY > 1024 || 10#$MATCHED_CONCURRENCY > cpus )); then
            echo "::error::concurrency '$MATCHED_CONCURRENCY' must be an integer from 1 to 1024 and at most the $cpus usable CPUs"
            exit 1
          fi
      - name: Dependencies and fixture checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$PROFILE_ROOT/dependencies.log"
          python3 -m unittest discover -s benchmarks/tests -v 2>&1 | tee "$PROFILE_ROOT/fixture-tests.log"
          python3 -m unittest discover -s benchmarks/profiling -p 'test_*.py' -v 2>&1 | tee "$PROFILE_ROOT/controller-fixture-tests.log"
      - name: Build one candidate before profiling
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p oximut-cli 2>&1 | tee "$PROFILE_ROOT/build.log"
          cp "$CARGO_TARGET_DIR/release/oximut" "$PROFILE_ROOT/oximut"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['PROFILE_ROOT'])
          capture = lambda *cmd: subprocess.check_output(cmd, text=True).strip()
          files = capture('git', 'ls-files').splitlines()
          record = {
              'commit': capture('git', 'rev-parse', 'HEAD'),
              'build_flags': '--locked --release -p oximut-cli',
              'cargo_target_dir': os.environ['CARGO_TARGET_DIR'],
              'rustflags': os.environ.get('RUSTFLAGS'),
              'cargo_encoded_rustflags': os.environ.get('CARGO_ENCODED_RUSTFLAGS'),
              'host': capture('uname', '-a'),
              'os_release': pathlib.Path('/etc/os-release').read_text(),
              'cpu': capture('lscpu'),
              'cpu_affinity': sorted(os.sched_getaffinity(0)),
              'github_runner': {key: os.environ.get(key) for key in ('ImageOS', 'ImageVersion', 'RUNNER_ARCH', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')},
              'tool_versions': {tool: capture(tool, '--version') for tool in ['rustc', 'cargo', 'node', 'npm', 'python3']},
              'binary_sha256': hashlib.sha256((root / 'oximut').read_bytes()).hexdigest(),
              'source_sha256': {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
                                for name in files if pathlib.Path(name).is_file()},
              'source_archive_sha256': hashlib.sha256((root / 'source.tar.gz').read_bytes()).hexdigest(),
          }
          (root / 'build-metadata.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Score fresh worker snapshots including their generation cost
        if: endsWith(inputs.capture_mode, '-score')
        shell: bash
        env:
          PROFILE_WORKLOAD: ${{ inputs.workload }}
          MATCHED_CONCURRENCY: ${{ inputs.concurrency }}
          SCORE_MODE: ${{ inputs.capture_mode }}
        run: |
          set -euo pipefail
          test "$PROFILE_WORKLOAD" = colord-scale
          test "$MATCHED_CONCURRENCY" = 4
          test -z "${NODE_OPTIONS:-}"
          export OXIMUT_SNAPSHOT_SCORE_BINARY="$PROFILE_ROOT/oximut"
          if [[ "$SCORE_MODE" != worker-snapshot-score ]]; then
            export OXIMUT_SNAPSHOT_COMPACT_ERRORS=1
          fi
          if [[ "$SCORE_MODE" != worker-snapshot-score && "$SCORE_MODE" != worker-snapshot-compact-score ]]; then
            export OXIMUT_SNAPSHOT_SPECIALIZE_SELECTOR=1
          fi
          before="$PROFILE_ROOT/oximut"
          after=benchmarks/experiments/vitest-fork-bundle/score-wrapper.sh
          case "$SCORE_MODE" in
            worker-snapshot-rolling-score|worker-snapshot-windowed-score|worker-snapshot-late-score)
              before="$after"
              after="benchmarks/experiments/vitest-fork-bundle/${SCORE_MODE#worker-snapshot-}-wrapper.sh"
              ;;
            worker-snapshot-factory-score)
              before=benchmarks/experiments/vitest-fork-bundle/late-score-wrapper.sh
              after=benchmarks/experiments/vitest-fork-bundle/factory-score-wrapper.sh
              ;;
            worker-snapshot-shared-image-score)
              before=benchmarks/experiments/vitest-fork-bundle/factory-score-wrapper.sh
              after=benchmarks/experiments/vitest-fork-bundle/shared-image-score-wrapper.sh
              ;;
            worker-snapshot-single-image-score)
              before=benchmarks/experiments/vitest-fork-bundle/shared-image-score-wrapper.sh
              after=benchmarks/experiments/vitest-fork-bundle/single-image-score-wrapper.sh
              ;;
            worker-snapshot-reuse-build-score)
              before=benchmarks/experiments/vitest-fork-bundle/single-image-score-wrapper.sh
              after=benchmarks/experiments/vitest-fork-bundle/reuse-build-score-wrapper.sh
              ;;
            worker-snapshot-early-build-score)
              before=benchmarks/experiments/vitest-fork-bundle/reuse-build-score-wrapper.sh
              after=benchmarks/experiments/vitest-fork-bundle/early-build-score-wrapper.sh
              ;;
          esac
          printf '%s\n' "$SCORE_MODE" > "$PROFILE_ROOT/snapshot-score-mode.txt"
          revision=$(git rev-parse HEAD)
          python3 benchmarks/compare_candidates.py --workload "$PROFILE_WORKLOAD" --concurrency "$MATCHED_CONCURRENCY" \
            --before-binary "$before" --before-adapter-dir packages/vitest-adapter --before-commit "$revision" \
            --after-binary "$after" \
            --after-adapter-dir packages/vitest-adapter --after-commit "$revision" \
            --output "$PROFILE_ROOT/snapshot-score" --warmups 1 --repetitions 5 --timeout 1200 \
            2>&1 | tee "$PROFILE_ROOT/snapshot-score.log"
      - name: Confirm factory evaluation in every fresh mutant fork
        if: contains(fromJSON('["worker-snapshot-factory-score","worker-snapshot-shared-image-score","worker-snapshot-single-image-score","worker-snapshot-reuse-build-score","worker-snapshot-early-build-score"]'), inputs.capture_mode)
        shell: bash
        env:
          OXIMUT_INLINE_LATE_RUNTIME: '1'
          OXIMUT_PROJECT_FACTORY_SNAPSHOT: '1'
          OXIMUT_SHARE_PROJECT_IMAGE: ${{ inputs.capture_mode == 'worker-snapshot-factory-score' && '0' || '1' }}
          OXIMUT_REUSE_PROJECT_BUILD: ${{ (inputs.capture_mode == 'worker-snapshot-reuse-build-score' || inputs.capture_mode == 'worker-snapshot-early-build-score') && '1' || '0' }}
          OXIMUT_EARLY_PROJECT_BUILD: ${{ inputs.capture_mode == 'worker-snapshot-early-build-score' && '1' || '0' }}
          FACTORY_SCORE_MODE: ${{ inputs.capture_mode }}
        run: |
          set -euo pipefail
          ulimit -c 0
          image_dir=$(mktemp -d "$GITHUB_WORKSPACE/node_modules/vitest/dist/.oximut-factory.XXXXXX")
          trap 'rm -r "$image_dir"' EXIT
          node benchmarks/experiments/vitest-fork-bundle/snapshot.mjs "$image_dir"
          node --build-snapshot --snapshot-blob="$image_dir/vitest.blob" "$image_dir/seed.cjs"
          mv "$image_dir/seed.cjs" "$image_dir/seed.offline.cjs"
          cp -R "$image_dir" "$PROFILE_ROOT/factory-image"
          options=()
          if [[ "$FACTORY_SCORE_MODE" == worker-snapshot-single-image-score || "$FACTORY_SCORE_MODE" == worker-snapshot-reuse-build-score || "$FACTORY_SCORE_MODE" == worker-snapshot-early-build-score ]]; then
            options+=(--snapshot-mutants-only)
          fi
          python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
            --worker-phases --startup-contract --first-collection --fork-snapshot "$image_dir/vitest.blob" \
            "${options[@]}" \
            --snapshot-compact-errors --snapshot-bundle-project --workload colord-scale --concurrency 4 \
            --output "$PROFILE_ROOT/factory-capture" 2>&1 | tee "$PROFILE_ROOT/factory-diagnostic.log"
      - name: Capture unchanged workload with profiler overhead, no ratios or targets
        if: ${{ !endsWith(inputs.capture_mode, '-score') }}
        shell: bash
        env:
          CAPTURE_MODE: ${{ inputs.capture_mode || 'accounting' }}
          PROFILE_WORKLOAD: ${{ inputs.workload || 'colord' }}
          MATCHED_CONCURRENCY: ${{ inputs.concurrency || '1' }}
          LATE_RUNTIME_SAMPLE: ${{ inputs.late_runtime_sample || 'none' }}
          ACCOUNTING_VARIANT: ${{ inputs.accounting_variant || 'shared-image' }}
        run: |
          set -euo pipefail
          case "$CAPTURE_MODE" in
            accounting|worker-snapshot-accounting) CAPTURE_ARGS=(--accounting) ;;
            controller-jobs) CAPTURE_ARGS=(--controller-jobs) ;;
            worker-phases) CAPTURE_ARGS=(--worker-phases) ;;
            fresh-worker-startup)
              test "$PROFILE_WORKLOAD" = colord-scale
              test "$MATCHED_CONCURRENCY" = 4
              CAPTURE_ARGS=(--worker-phases --startup-contract --first-collection)
              ;;
            worker-bundle)
              test "$PROFILE_WORKLOAD" = colord-scale
              test "$MATCHED_CONCURRENCY" = 4
              bundle_dir=$(mktemp -d "$GITHUB_WORKSPACE/node_modules/vitest/dist/.oximut-bundle.XXXXXX")
              node benchmarks/experiments/vitest-fork-bundle/build.mjs "$bundle_dir"
              cp -R "$bundle_dir" "$PROFILE_ROOT/bundle"
              OXIMUT_BUNDLE_FIXTURE=1 OXIMUT_BUNDLE_ROUTES="$bundle_dir/routes.json" \
                NODE_OPTIONS="--require=$GITHUB_WORKSPACE/benchmarks/experiments/vitest-fork-bundle/route.cjs" \
                node --test packages/vitest-adapter/test/shared-lanes.test.mjs | tee "$PROFILE_ROOT/bundled-fixture.log"
              CAPTURE_ARGS=(--worker-phases --startup-contract --first-collection)
              ;;
            worker-snapshot|worker-snapshot-source-io|worker-snapshot-stack|worker-snapshot-collection-cpu|worker-snapshot-execution-cpu|worker-snapshot-native-project|worker-snapshot-baseline-tier|worker-snapshot-compact-errors|worker-snapshot-specialize-selector|worker-snapshot-bundle-project|worker-snapshot-composed-profile|worker-snapshot-composed-startup|worker-snapshot-zygote-startup|worker-snapshot-late-runtime)
              test "$PROFILE_WORKLOAD" = colord-scale
              test "$MATCHED_CONCURRENCY" = 4
              snapshot_dir=$(mktemp -d "$GITHUB_WORKSPACE/node_modules/vitest/dist/.oximut-snapshot.XXXXXX")
              ulimit -c 0
              /usr/bin/time -v -o "$PROFILE_ROOT/snapshot-bundle.time" \
                node benchmarks/experiments/vitest-fork-bundle/snapshot.mjs "$snapshot_dir"
              /usr/bin/time -v -o "$PROFILE_ROOT/snapshot-build.time" \
                node --build-snapshot --snapshot-blob="$snapshot_dir/vitest.blob" "$snapshot_dir/seed.cjs" \
                2>&1 | tee "$PROFILE_ROOT/snapshot-build.log"
              cp -R "$snapshot_dir" "$PROFILE_ROOT/snapshot"
              OXIMUT_SNAPSHOT_BLOB="$snapshot_dir/vitest.blob" \
                NODE_OPTIONS="--require=$GITHUB_WORKSPACE/benchmarks/experiments/vitest-fork-bundle/snapshot-flags.cjs" \
                node --test packages/vitest-adapter/test/shared-lanes.test.mjs | tee "$PROFILE_ROOT/snapshot-fixture.log"
              CAPTURE_ARGS=(--worker-phases --startup-contract)
              ;;
            segments) CAPTURE_ARGS=(--segments) ;;
            *) echo 'Unsupported capture mode' >&2; exit 1 ;;
          esac
          python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
            "${CAPTURE_ARGS[@]}" --workload "$PROFILE_WORKLOAD" --concurrency "$MATCHED_CONCURRENCY" \
            --output "$PROFILE_ROOT/capture" 2>&1 | tee "$PROFILE_ROOT/diagnostic.log"
          if test "$CAPTURE_MODE" = worker-snapshot-accounting; then
            test "$PROFILE_WORKLOAD" = colord-scale
            test "$MATCHED_CONCURRENCY" = 4
            case "$ACCOUNTING_VARIANT" in
              shared-image|single-image|reuse-build) ;;
              *) exit 2 ;;
            esac
            wrapper="benchmarks/experiments/vitest-fork-bundle/$ACCOUNTING_VARIANT-score-wrapper.sh"
            printf '%s\n' "$wrapper" > "$PROFILE_ROOT/accounting-wrapper.txt"
            OXIMUT_SNAPSHOT_SCORE_BINARY="$PROFILE_ROOT/oximut" \
              OXIMUT_SNAPSHOT_COMPACT_ERRORS=1 OXIMUT_SNAPSHOT_SPECIALIZE_SELECTOR=1 \
              SCORE_MODE="worker-snapshot-$ACCOUNTING_VARIANT-score" \
              python3 benchmarks/profile_native.py \
              --binary "$GITHUB_WORKSPACE/$wrapper" \
              --accounting --workload "$PROFILE_WORKLOAD" --concurrency "$MATCHED_CONCURRENCY" \
              --output "$PROFILE_ROOT/snapshot-accounting-capture" 2>&1 | tee "$PROFILE_ROOT/snapshot-accounting.log"
          fi
          if test "$CAPTURE_MODE" = fresh-worker-startup; then
            node benchmarks/profiling/fresh-worker-startup.mjs "$PROFILE_ROOT/capture/profiles" "$PROFILE_ROOT"
          fi
          if test "$CAPTURE_MODE" = worker-bundle; then
            python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
              "${CAPTURE_ARGS[@]}" --fork-bundle-routes "$bundle_dir/routes.json" \
              --workload "$PROFILE_WORKLOAD" --concurrency "$MATCHED_CONCURRENCY" \
              --output "$PROFILE_ROOT/bundled-capture" 2>&1 | tee "$PROFILE_ROOT/bundled-diagnostic.log"
          fi
          if [[ "$CAPTURE_MODE" == worker-snapshot || "$CAPTURE_MODE" == worker-snapshot-source-io ]]; then
            python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
              "${CAPTURE_ARGS[@]}" --fork-snapshot "$snapshot_dir/vitest.blob" \
              --workload "$PROFILE_WORKLOAD" --concurrency "$MATCHED_CONCURRENCY" \
              --output "$PROFILE_ROOT/snapshot-capture" 2>&1 | tee "$PROFILE_ROOT/snapshot-diagnostic.log"
          fi
          if test "$CAPTURE_MODE" = worker-snapshot-source-io; then
            # The archived seed is build provenance. Restoring the image and
            # loading its bridges does not need the original builder source.
            cmp "$snapshot_dir/seed.cjs" "$PROFILE_ROOT/snapshot/seed.cjs"
            mv "$snapshot_dir/seed.cjs" "$snapshot_dir/seed.offline.cjs"
            python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
              "${CAPTURE_ARGS[@]}" --fork-snapshot "$snapshot_dir/vitest.blob" \
              --workload "$PROFILE_WORKLOAD" --concurrency "$MATCHED_CONCURRENCY" \
              --output "$PROFILE_ROOT/snapshot-offline-capture" 2>&1 | tee "$PROFILE_ROOT/snapshot-offline-diagnostic.log"
          fi
          if test "$CAPTURE_MODE" = worker-snapshot-stack; then
            mv "$snapshot_dir/seed.cjs" "$snapshot_dir/seed.offline.cjs"
            for mode in measure skip; do
              python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
                "${CAPTURE_ARGS[@]}" --fork-snapshot "$snapshot_dir/vitest.blob" --controller-stack-timing "$mode" \
                --workload "$PROFILE_WORKLOAD" --concurrency "$MATCHED_CONCURRENCY" \
                --output "$PROFILE_ROOT/stack-$mode-capture" 2>&1 | tee "$PROFILE_ROOT/stack-$mode-diagnostic.log"
            done
          fi
          if [[ "$CAPTURE_MODE" == worker-snapshot-collection-cpu || "$CAPTURE_MODE" == worker-snapshot-execution-cpu ]]; then
            mv "$snapshot_dir/seed.cjs" "$snapshot_dir/seed.offline.cjs"
            phase=${CAPTURE_MODE#worker-snapshot-}
            python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
              "${CAPTURE_ARGS[@]}" --fork-snapshot "$snapshot_dir/vitest.blob" "--$phase-sample" \
              --workload "$PROFILE_WORKLOAD" --concurrency "$MATCHED_CONCURRENCY" \
              --output "$PROFILE_ROOT/$phase-capture" 2>&1 | tee "$PROFILE_ROOT/$phase-diagnostic.log"
          fi
          if test "$CAPTURE_MODE" = worker-snapshot-native-project; then
            mv "$snapshot_dir/seed.cjs" "$snapshot_dir/seed.offline.cjs"
            python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
              "${CAPTURE_ARGS[@]}" --fork-snapshot "$snapshot_dir/vitest.blob" \
              --workload "$PROFILE_WORKLOAD" --concurrency "$MATCHED_CONCURRENCY" \
              --output "$PROFILE_ROOT/snapshot-offline-capture" 2>&1 | tee "$PROFILE_ROOT/snapshot-offline-diagnostic.log"
            python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
              "${CAPTURE_ARGS[@]}" --fork-snapshot "$snapshot_dir/vitest.blob" --native-project \
              --workload "$PROFILE_WORKLOAD" --concurrency "$MATCHED_CONCURRENCY" \
              --output "$PROFILE_ROOT/native-project-capture" 2>&1 | tee "$PROFILE_ROOT/native-project-diagnostic.log"
          fi
          if [[ "$CAPTURE_MODE" == worker-snapshot-baseline-tier || "$CAPTURE_MODE" == worker-snapshot-compact-errors || "$CAPTURE_MODE" == worker-snapshot-specialize-selector || "$CAPTURE_MODE" == worker-snapshot-bundle-project ]]; then
            mv "$snapshot_dir/seed.cjs" "$snapshot_dir/seed.offline.cjs"
            experiment=${CAPTURE_MODE#worker-snapshot-}
            for arm in snapshot-offline "$experiment"; do
              extra=()
              if test "$arm" = "$experiment"; then extra+=("--snapshot-$experiment"); fi
              python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
                "${CAPTURE_ARGS[@]}" "${extra[@]}" --fork-snapshot "$snapshot_dir/vitest.blob" \
                --workload "$PROFILE_WORKLOAD" --concurrency "$MATCHED_CONCURRENCY" \
                --output "$PROFILE_ROOT/$arm-capture" 2>&1 | tee "$PROFILE_ROOT/$arm-diagnostic.log"
            done
          fi
          if [[ "$CAPTURE_MODE" == worker-snapshot-composed-profile || "$CAPTURE_MODE" == worker-snapshot-composed-startup || "$CAPTURE_MODE" == worker-snapshot-zygote-startup || "$CAPTURE_MODE" == worker-snapshot-late-runtime ]]; then
            mv "$snapshot_dir/seed.cjs" "$snapshot_dir/seed.offline.cjs"
            profiling=(--first-collection)
            if [[ "$CAPTURE_MODE" == worker-snapshot-composed-startup || "$CAPTURE_MODE" == worker-snapshot-zygote-startup ]]; then
              profiling+=(--startup-cpu-sample)
            fi
            python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
              "${CAPTURE_ARGS[@]}" "${profiling[@]}" --fork-snapshot "$snapshot_dir/vitest.blob" \
              --snapshot-compact-errors --snapshot-specialize-selector --snapshot-bundle-project \
              --workload "$PROFILE_WORKLOAD" --concurrency "$MATCHED_CONCURRENCY" \
              --output "$PROFILE_ROOT/composed-capture" 2>&1 | tee "$PROFILE_ROOT/composed-diagnostic.log"
          fi
          if [[ "$CAPTURE_MODE" == worker-snapshot-composed-startup || "$CAPTURE_MODE" == worker-snapshot-zygote-startup ]]; then
            node benchmarks/profiling/fresh-worker-startup.mjs \
              "$PROFILE_ROOT/composed-capture/profiles" "$PROFILE_ROOT"
          fi
          if test "$CAPTURE_MODE" = worker-snapshot-zygote-startup; then
            node_include="$(dirname -- "$(dirname -- "$(command -v node)")")/include/node"
            gcc -shared -fPIC -O2 -Wall -I"$node_include" -o "$PROFILE_ROOT/zygote-fork.node" \
              benchmarks/experiments/zygote-fork/fork.c
            sha256sum "$PROFILE_ROOT/zygote-fork.node" benchmarks/experiments/zygote-fork/fork.c \
              benchmarks/profiling/zygote-worker.cjs benchmarks/profiling/zygote-startup.mjs \
              | tee "$PROFILE_ROOT/zygote-provenance.txt"
            ZYGOTE_ADDON="$PROFILE_ROOT/zygote-fork.node" node --expose-internals \
              benchmarks/profiling/zygote-startup.mjs "$PROFILE_ROOT/composed-capture/profiles" "$PROFILE_ROOT" 24 \
              2>&1 | tee "$PROFILE_ROOT/zygote-startup.log"
          fi
          if test "$CAPTURE_MODE" = worker-snapshot-late-runtime; then
            sampling=()
            if test "$LATE_RUNTIME_SAMPLE" = execution; then sampling+=(--execution-cpu-sample); fi
            late_dir=$(mktemp -d "$GITHUB_WORKSPACE/node_modules/vitest/dist/.oximut-snapshot-late.XXXXXX")
            OXIMUT_INLINE_LATE_RUNTIME=1 /usr/bin/time -v -o "$PROFILE_ROOT/late-bundle.time" \
              node benchmarks/experiments/vitest-fork-bundle/snapshot.mjs "$late_dir"
            /usr/bin/time -v -o "$PROFILE_ROOT/late-build.time" \
              node --build-snapshot --snapshot-blob="$late_dir/vitest.blob" "$late_dir/seed.cjs" \
              2>&1 | tee "$PROFILE_ROOT/late-build.log"
            cp -R "$late_dir" "$PROFILE_ROOT/snapshot-late-runtime"
            mv "$late_dir/seed.cjs" "$late_dir/seed.offline.cjs"
            python3 benchmarks/profile_native.py --binary "$PROFILE_ROOT/oximut" \
              "${CAPTURE_ARGS[@]}" --first-collection --fork-snapshot "$late_dir/vitest.blob" \
              "${sampling[@]}" \
              --snapshot-compact-errors --snapshot-specialize-selector --snapshot-bundle-project \
              --workload "$PROFILE_WORKLOAD" --concurrency "$MATCHED_CONCURRENCY" \
              --output "$PROFILE_ROOT/late-runtime-capture" 2>&1 | tee "$PROFILE_ROOT/late-runtime-diagnostic.log"
          fi
      - name: Publish diagnostic status and remove dependency symlinks
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/native-diagnostic/snapshot-score/summary.json"; then
            {
              echo '### Unprofiled snapshot score with image generation included'
              echo '```json'
              jq '{correctness_gate, comparisons, targets_met}' "$RUNNER_TEMP/native-diagnostic/snapshot-score/summary.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            find "$RUNNER_TEMP/native-diagnostic" -type l -name node_modules -delete
            exit 0
          fi
          {
            echo '### Diagnostic CPU capture (profiler overhead; no performance score)'
            echo 'Qualification failures and incomplete profiles are retained. No automatic retries.'
            echo 'Accounting mode measures CLI sampling-thread self CPU only; Node/Python modes remain separate. No mode partitions whole product CPU.'
            if test -f "$RUNNER_TEMP/native-diagnostic/capture/diagnostic.json"; then
              echo '```json'
              python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'benchmarks')
          from profile_native import compact_summary
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-diagnostic/capture/diagnostic.json'
          print(json.dumps(compact_summary(json.loads(source.read_text())), indent=2))
          PY
              echo '```'
            else
              echo 'FAILED/INCOMPLETE: capture summary absent; inspect setup/build/job logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if test -d "$RUNNER_TEMP/native-diagnostic"; then
            find "$RUNNER_TEMP/native-diagnostic" -type l -name node_modules -delete
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-diagnostic/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
